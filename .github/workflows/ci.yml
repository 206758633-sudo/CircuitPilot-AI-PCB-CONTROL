name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: runtime + framework + plugin + frontend
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime tests
        run: npm run test:runtime
      - name: Design framework tests
        run: npm run test:design-framework
      - name: Frontend tests
        run: npx vitest run
      - name: MCP agent tests
        run: node --test "agent/__tests__/*.test.mjs"
      - name: Verification agent tests
        run: node --test verification/agent/contract.test.mjs verification/agent/security.test.mjs
      - name: DSH plugin tests
        working-directory: plugin/dsh-circuitpilot
        run: node --test "test/*.test.mjs"
