name: CI

# 这个工作流的存在理由：2026-08-26 的 EdaPage 重构引入了 18 处类型错误，
# 但 `npm test` 只跑 vitest + node:test，typecheck 不在其中，于是测试全绿而
# `npm run build`（以及 Tauri 的 beforeBuildCommand）连续数周失败且无人发现。
# 因此这里把 typecheck 作为第一步强制门禁。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · unit · runtime · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 发布前最容易漏的一步：版本号四处声明不一致，会导致 OTA 更新"版本没变"或安装包与 UI 不一致。
      # 只检查不写文件；发版时用 npm run version:sync 统一改写。
      - name: Version consistency (runtime/version.mjs is the source)
        run: npm run version:check

      # 知识包是"经验升级"的交付物：这里只验证当前数据集能构建 + 自校验通过（含 doc 指针存在性），
      # 避免发版时才发现数据集坏了、打不出可分发的知识包。
      - name: Knowledge pack build + verify
        run: |
          node scripts/knowledge-pack.mjs build --pack-version 2026.01.01 --validate --out /tmp/knowledge-pack-ci.json
          node scripts/knowledge-pack.mjs verify /tmp/knowledge-pack-ci.json

      - name: Typecheck (fails fast — this is what `vite build` cannot catch)
        run: npm run typecheck

      - name: Unit tests + coverage gate (vitest)
        run: npm run test:coverage

      - name: Runtime tests (node:test, includes runtime/engineering)
        run: npm run test:runtime

      - name: Production dependency audit (dev-only advisories are not shipped)
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Web build (tsc + vite build — same command Tauri runs beforeBuildCommand)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  portability-smoke:
    name: cross-platform Node smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Platform/keychain contract tests
        run: node --test runtime/__tests__/platform.test.mjs runtime/__tests__/portable-keychain.test.mjs runtime/__tests__/agent-token.test.mjs

  # 桌面壳层的编译与打包未包含在上面的 job 中：完整的 tauri build 需要 macOS runner
  # 与签名/公证凭据。这里只验证 Rust 代码本身能编译，并把打包留给发布流程。
  desktop-compile:
    name: tauri rust compile check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      # externalBin 要求在 cargo check 之前 sidecar 已经存在。
      - name: Stage the Node runtime sidecar
        run: npm run sidecar:stage
      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
