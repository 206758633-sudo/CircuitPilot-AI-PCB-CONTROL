name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / evidence impact
      description: Does this touch write paths, approvals, gates, or EDA automation?
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I did not include secrets, customer files, or manufacturing outputs.
          required: true
